[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/core",
    "crates/source-omdb",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
form_urlencoded = "1"
mntk-core = { path = "crates/core" }
mntk-source-omdb = { path = "crates/source-omdb" }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
ureq = "3"
